x-n8n-common-env: &n8n-common-env
  TZ: America/Sao_Paulo
  GENERIC_TIMEZONE: America/Sao_Paulo
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
  N8N_RUNNERS_ENABLED: "true"
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
  N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
  ## Postgres
  DB_TYPE: postgresdb
  DB_POSTGRESDB_DATABASE: postgres
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: 5432
  DB_POSTGRESDB_USER: postgres
  DB_POSTGRESDB_PASSWORD: postgres
  ## Queue Mode
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
  ## Webhook
  WEBHOOK_URL: https://cupid-sniff-stem.ngrok-free.dev

services:
  n8n-editor:
    # Editor e worker DEVEM usar a mesma versão
    image: n8nio/n8n:2.46.6
    container_name: n8n-editor-ftr
    ports:
      - 5678:5678
    volumes:
      - ./n8n-data:/home/node/.n8n
    environment:
      <<: *n8n-common-env
      N8N_MIGRATE_FS_STORAGE_PATH: "true"
    networks:
      - n8n-ftr
    depends_on:
      - postgres
      - redis
    restart: always

  n8n-worker:
    image: n8nio/n8n:2.46.6
    command: worker
    volumes:
      - ./n8n-data:/home/node/.n8n
    environment:
      <<: *n8n-common-env
    networks:
      - n8n-ftr
    depends_on:
      - postgres
      - redis
      - n8n-editor
    restart: always

  postgres:
    image: ankane/pgvector
    ports:
      - 5432:5432
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
    networks:
      - n8n-ftr
    restart: always

  redis:
    image: redis:alpine
    ports:
      - 6379:6379
    volumes:
      - ./redis-data:/data
    networks:
      - n8n-ftr
    restart: always

  ngrok:
    image: ngrok/ngrok:latest
    ports:
      - 4040:4040
    command: http --domain=cupid-sniff-stem.ngrok-free.dev n8n-editor-ftr:5678
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    restart: always
    networks:
      - n8n-ftr
    depends_on:
      - n8n-editor

networks:
  n8n-ftr:
    driver: bridge
